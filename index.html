    <meta charset="UTF-8" />

    <title>ClaimLens — AI Claims Specialist & Appeal Engine</title>
    <meta name="description" content="Automate parsing, policy comparison, clause extraction, and appeal letter generation for denied insurance claims with interactive portal auto-fill." />
    <meta property="og:title" content="ClaimLens — AI Claims Specialist & Appeal Engine" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // HMR is disabled in AI Studio preview environments. Safely ignore WebSocket connection noise.
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || event.reason?.message?.includes('WebSocket'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && String(event.message).includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-blue-100 selection:text-blue-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
